# transit/docker-compose.3.10.yml
# Throwaway-Stack: Moodle 3.10 in Container restoren
# Nutzung: docker compose -p transit310 -f docker-compose.3.10.yml up -d

services:
  moodle_db:
    image: mysql:8.0
    container_name: transit310-moodle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - moodle_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  moodle_app:
    image: php:7.4-apache
    container_name: transit310-moodle_app
    restart: unless-stopped
    depends_on:
      moodle_db:
        condition: service_healthy
    ports:
      - "8090:80"
    volumes:
      - ./moodle-src/moodle-3.10:/var/www/html
      - moodledata:/var/www/moodledata
    networks:
      - moodle_net
    environment:
      MOODLE_DB_HOST: moodle_db
      MOODLE_DB_NAME: ${MYSQL_DATABASE}
      MOODLE_DB_USER: ${MYSQL_USER}
      MOODLE_DB_PASSWORD: ${MYSQL_PASSWORD}

networks:
  moodle_net:
    driver: bridge

volumes:
  moodledata:
    name: transit310_moodledata
  db_data:
    name: transit310_db_data
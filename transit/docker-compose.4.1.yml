# transit/docker-compose.4.1.yml
# Upgrade-Stufe: 3.11 → 4.1 LTS
# Nutzung: docker compose -p transit41 -f docker-compose.4.1.yml up -d

services:
  moodle_db:
    image: mysql:8.0
    container_name: transit41-moodle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - moodle_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  moodle_app:
    image: php:8.1-apache
    container_name: transit41-moodle_app
    restart: unless-stopped
    depends_on:
      moodle_db:
        condition: service_healthy
    ports:
      - "8092:80"
    volumes:
      - ./moodle-src/moodle-4.1:/var/www/html
      - moodledata:/var/www/moodledata
    networks:
      - moodle_net

networks:
  moodle_net:
    driver: bridge

volumes:
  moodledata:
    name: transit41_moodledata
  db_data:
    name: transit41_db_data